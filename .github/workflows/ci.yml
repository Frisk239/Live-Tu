name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # S0 可信 CI：全量 server 测试（fresh DB 门禁，自动发现 + 每文件隔离库）
      - run: npm run test:server
      # legacy DB 升级门禁（旧库 → 最新 schema）
      - run: npm run test:server:legacy
      # P0 viral probe 专项门禁（provider-capabilities / viral-subclip / viral-control-image /
      # viral-probe-runner 契约测试，全部零真实付费；CI 无 provider 密钥也能跑）
      - run: npm run test:viral
      - run: npm run test:production
      # S1 黄金集门禁：对比仓库 fixture 基线；加权质量下降 >5% 或 hard gate 回归 → 非零退出
      # 定性（审查共识）：真实样本接入前这是「算法漂移门禁」——证明评分器/权重/编排改动
      # 未降低确定性的筛选分，不等价于真实视频质量门禁；fixture 基线全部 unverified，
      # unverified 显式列出但不阻断（阻断只看回归）。真实质量门禁随真实黄金样本接入自动生效。
      - name: Golden set regression gate (S1)
        run: npm run eval:golden -- --baseline server/test/fixtures/golden-baseline.json
      - name: Build production container
        run: docker build --tag live-tu:ci .

      - name: Validate production Compose and Caddy
        working-directory: app/deploy
        env:
          APP_DOMAIN: app.example.invalid
          ACME_EMAIL: ops@example.invalid
          ADMIN_USERNAME: audit-admin
          ADMIN_PASSWORD: audit-password-123
          MODEL_KEY_ENCRYPTION_SECRET: audit-encryption-secret-at-least-32chars
          MEDIA_URL_SIGNING_SECRET: audit-media-signing-secret-at-least-32chars
          METRICS_TOKEN: audit-metrics-token
          YUNWU_API_KEY: audit-yunwu-key
          SEEDANCE_BASE_URL: https://seedance.example.invalid
          SEEDANCE_ACCOUNT: audit
          SEEDANCE_PASSWORD: audit-password
          MINIO_ROOT_USER: audit-root
          MINIO_ROOT_PASSWORD: audit-root-password
          MINIO_ACCESS_KEY: audit-key
          MINIO_SECRET_KEY: audit-secret
        run: |
          docker compose -f compose.production.yml config --quiet
          docker run --rm \
            -e APP_DOMAIN="$APP_DOMAIN" \
            -e ACME_EMAIL="$ACME_EMAIL" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile

      - run: npx playwright install --with-deps chromium
      - name: Start development server
        run: |
          npm run dev > /tmp/live-tu-server.log 2>&1 &
          echo $! > /tmp/live-tu-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3004/api/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/live-tu-server.log
          exit 1
        env:
          PORT: 3004
          ALLOW_MOCK_FALLBACK: "false"
          # 禁止后台 worker 执行真实生成：smoke 创建 run 只为验证 UI 渲染，避免任何付费/外部调用
          PIPELINE_WORKER_DISABLED: "true"
          # S2 工作台 E2E 需要 fake 视频 provider（独立 runner 自起服务器并自带该 env，
          # 这里仅为与 test:e2e:all 共用服务器的场景保持一致，绝不触发真实付费）
          FAKE_VIDEO_PROVIDER: "true"

      - run: npm run test:e2e:all
        env:
          E2E_BASE_URL: http://127.0.0.1:3004

      # S2 工作台专属门禁（自包含 runner：独立端口 + 临时 DB + FAKE_VIDEO_PROVIDER=true
      # + FAKE_VIDEO_FAIL_NEXT=1 确定性重试演示 + PIPELINE_WORKER_DISABLED=true，零真实付费）
      - name: S2 workbench e2e gate
        run: npm run test:e2e:workbench

      # P3 质量闭环专属门禁（自包含 runner：独立端口 + 临时 DB + fake 视频/技术 QA/语义 QA
      # 注入：第 1 镜可恢复缺陷（fail-once）、第 2 镜持续不合格（修复上限 + 人工通过），零真实付费）
      - name: P3 quality-loop e2e gate
        run: npm run test:e2e:quality-loop

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/live-tu-server.log || true

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: live-tu:${LIVE_TU_IMAGE_TAG:-demo}
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      bgm-init:
        condition: service_completed_successfully
    ports:
      - "${DEMO_PORT:-3004}:3004"
    environment:
      NODE_ENV: production
      PORT: 3004
      DATA_DIR: /var/lib/live-tu/data
      UPLOADS_DIR: /var/lib/live-tu/uploads
      BACKUP_DIR: /var/lib/live-tu/backups
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      MODEL_KEY_ENCRYPTION_SECRET: ${MODEL_KEY_ENCRYPTION_SECRET:?MODEL_KEY_ENCRYPTION_SECRET is required}
      MEDIA_URL_SIGNING_SECRET: ${MEDIA_URL_SIGNING_SECRET:?MEDIA_URL_SIGNING_SECRET is required}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-3600}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      YUNWU_BASE_URL: ${YUNWU_BASE_URL:-https://api3.wlai.vip/v1}
      YUNWU_API_KEY: ${YUNWU_API_KEY:-}
      TEXT_MODEL: ${TEXT_MODEL:-gemini-3.6-flash}
      SEEDANCE_BASE_URL: ${SEEDANCE_BASE_URL:-}
      SEEDANCE_ACCOUNT: ${SEEDANCE_ACCOUNT:-}
      SEEDANCE_PASSWORD: ${SEEDANCE_PASSWORD:-}
      SEEDANCE_PROVIDER: ${SEEDANCE_PROVIDER:-relay}
      SEEDANCE_MODEL: ${SEEDANCE_MODEL:-doubao-seedance-2-0-fast}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_MODEL: ${ARK_MODEL:-doubao-seedance-2-0-260128}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-buv-materials-demo}
      MINIO_ENSURE_PUBLIC_READ: "false"
      MINIO_PUBLIC_URL: ""
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-true}
      MIN_FREE_STORAGE_BYTES: ${MIN_FREE_STORAGE_BYTES:-536870912}
      MAX_REMOTE_MEDIA_BYTES: ${MAX_REMOTE_MEDIA_BYTES:-209715200}
      MAX_REMOTE_IMAGE_BYTES: ${MAX_REMOTE_IMAGE_BYTES:-20971520}
      BACKUP_DRAIN_TIMEOUT_MS: ${BACKUP_DRAIN_TIMEOUT_MS:-30000}
      MATERIAL_IMPORT_ROOT: ${MATERIAL_IMPORT_ROOT:-}
      EXPENSIVE_REQUESTS_PER_MINUTE: ${EXPENSIVE_REQUESTS_PER_MINUTE:-20}
      MAX_USER_STORAGE_BYTES: ${MAX_USER_STORAGE_BYTES:-5368709120}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-30000}
      PIPELINE_WORKER_CONCURRENCY: ${PIPELINE_WORKER_CONCURRENCY:-1}
      ARTIFACT_RETENTION_DAYS: ${ARTIFACT_RETENTION_DAYS:-30}
      RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    volumes:
      - live-tu-demo-data:/var/lib/live-tu/data
      - live-tu-demo-uploads:/var/lib/live-tu/uploads
      - live-tu-demo-backups:/var/lib/live-tu/backups
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3004/api/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    expose:
      - "9000"
    volumes:
      - live-tu-demo-minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:9000/minio/health/ready
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-buv-materials-demo}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/*"]}]}' > /tmp/live-tu-policy.json
        mc admin policy info local live-tu-app >/dev/null 2>&1 || mc admin policy create local live-tu-app /tmp/live-tu-policy.json
        mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" || true
        mc admin policy attach local live-tu-app --user "$$MINIO_ACCESS_KEY"

  bgm-init:
    image: live-tu:${LIVE_TU_IMAGE_TAG:-demo}
    restart: "no"
    entrypoint: ["node", "-e"]
    command:
      - |
        const fs=require('fs'),path=require('path');
        const src='/app/assets/bgm',dst='/var/lib/live-tu/uploads/bgm';
        fs.mkdirSync(dst,{recursive:true});
        let n=0;
        for(const f of fs.readdirSync(src)){const t=path.join(dst,f);if(!fs.existsSync(t)){fs.copyFileSync(path.join(src,f),t);n++;}}
        console.log('bgm seeded:',n,'files, total',fs.readdirSync(dst).length);
    volumes:
      - live-tu-demo-uploads:/var/lib/live-tu/uploads

volumes:
  live-tu-demo-data:
  live-tu-demo-uploads:
  live-tu-demo-backups:
  live-tu-demo-minio-data:
